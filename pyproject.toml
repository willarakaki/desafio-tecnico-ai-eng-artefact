[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "emporio-da-musica-agent"
version = "0.1.0"
description = "Intelligent customer support agent for Empório da Música (Campo Grande/MS) with DuckDB, Hybrid RAG, Guardrails, Semantic Cache, HITL, and FinOps telemetry."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Willian Arakaki" },
]
dependencies = [
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "duckdb>=1.1.3,<2.0.0",
    "pypdf>=5.1.0,<6.0.0",
    "faiss-cpu>=1.9.0.post1,<2.0.0",
    "rank-bm25>=0.2.2,<1.0.0",
    "numpy>=2.1.0,<3.0.0",
    "langchain-core>=0.3.30,<1.0.0",
    "langchain-community>=0.3.15,<1.0.0",
    "langchain-text-splitters>=0.3.5,<1.0.0",
    "langchain-google-genai>=2.0.8,<3.0.0",
    "langchain-openai>=0.3.0,<1.0.0",
    "langchain-ollama>=0.2.2,<1.0.0",
    "langgraph>=0.2.60,<1.0.0",
    "presidio-anonymizer>=2.2.355,<3.0.0",
    "rich>=13.9.0,<15.0.0",
    "streamlit>=1.41.0,<2.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.32.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line length violations handled by ruff format / long prompt strings
    "RUF001", # allow Portuguese en/em dashes in strings
    "RUF002", # allow Portuguese en/em dashes in docstrings
    "RUF003", # allow Portuguese en/em dashes in comments
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.params.Depends",
    "fastapi.params.Query",
    "fastapi.params.Header",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"
